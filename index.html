      <img class="logo" src="debugging.png" alt="">

  <main>
    <div id="debug">
        <h2>Debug</h2>
        <p class="description">Insira as informações para a saída desejada:</p>

        <div class="card">
            <div class="checkbox-group">
                <div class="input-group ig-1">
                    <input class="checkbox" type="checkbox" id="check1" checked>
                    <input class="ds_check" type="text" id="option1" placeholder="Digite algo...">
                </div>
                <div class="input-group ig-2">
                    <input class="checkbox" type="checkbox" id="check2" checked>
                    <input class="ds_check" type="text" id="option2" placeholder="Digite algo...">
                </div>
                <div class="input-group ig-3">
                    <input class="checkbox" type="checkbox" id="check3">
                    <input class="ds_check" type="text" id="option3" placeholder="Digite algo...">
                </div>
                <div class="input-group ig-4">
                    <input class="checkbox" type="checkbox" id="check4">
                    <input class="ds_check" type="text" id="option4" placeholder="Digite algo...">
                </div>
                <div class="input-group ig-5">
                    <input class="checkbox" type="checkbox" id="check5">
                    <input class="ds_check" type="text" id="option5" placeholder="Digite algo...">
                </div>
            </div>

            <h3>Insira o texto:</h3>
            <textarea rows="5" id="editor1" placeholder="Digite sua query aqui..."></textarea>
            

            <div class="radio-container">
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="modo-formatacao" value="modo1" checked> Raise Application</label>
                    <label class="radio-label"><input type="radio" name="modo-formatacao" value="modo2"> Mensagem Abort</label>
                    <label class="radio-label"><input type="radio" name="modo-formatacao" value="modo3"> Insert em Campo</label>
                    <label class="radio-label"><input type="radio" name="modo-formatacao" value="modo4"> Log tasy</label>
                    <div id="codigoLogContainer"">
                        <input id="cdLog" type="text" placeholder="CD_LOG" maxlength="5" pattern="\d*">
                    </div>
                </div>
                <div class="area-button buttons-container">
                    <a href="#" onclick="formatarTexto()" class="button btn-principal">Formatar</a>
                    <a href="#" onclick="limparPainel()" class="button btn-secundario">Limpar</a>
                </div>
            </div>

        </div>

        <div class="card">
            <h3>Resultado:</h3>
            <pre class="pre1">
                <button class="copy-button" onclick="copiarTexto()"><i class="fas fa-copy"></i></button>
                <code id="highlight1" class="language-sql"></code>
            </pre>
        </div>
    </div>

    <div id="replace">
        <h2>Replace</h2>
        <p class="description">Insira o select e as variáveis para substituição:</p>

        <div class="replace-cards-container">
            <div class="card">
                <div class="fields-group">
                    <div class="select-group">
                        <h3>Select:</h3>
                        <textarea id="editor2" placeholder="Digite seu select aqui..."></textarea>
                    </div>

                    <div class="variables-group">
                        <h3>Variáveis:</h3>
                        <textarea id="variaveis" placeholder="Digite as variáveis aqui..."></textarea>
                    </div>
                </div>

                <div class="buttons-container">
                    <a href="#" onclick="substituirVariaveis()" class="button btn-principal">Substituir</a>
                    <a href="#" onclick="limparPainelSelect()" class="button btn-secundario">Limpar</a>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Resultado:</h3>
            <pre class="pre2">
                <button class="copy-button" onclick="copiarTexto()"><i class="fas fa-copy"></i></button>
                <code id="highlight2" class="language-sql"></code>
            </pre>
            <div class="buttons-container">

            </div>
        </div>
    </div>
